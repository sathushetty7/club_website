<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <defs>
    <!-- Cosmic Galaxy Gradient -->
    <linearGradient id="cosmic-badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#49317C" />
      <stop offset="50%" stop-color="#24133F" />
      <stop offset="100%" stop-color="#243B70" />
    </linearGradient>
    <radialGradient id="nebula-highlight" cx="70%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#D16BB5" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#D16BB5" stop-opacity="0" />
    </radialGradient>
    <filter id="violet-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#49317C" flood-opacity="0.45"/>
    </filter>
  </defs>
  
  <!-- Cosmic Badge Container -->
  <rect x="6" y="14" width="52" height="52" rx="15" fill="url(#cosmic-badge-grad)" filter="url(#violet-glow)" stroke="rgba(185,167,232,0.22)" stroke-width="1" />
  <rect x="6" y="14" width="52" height="52" rx="15" fill="url(#nebula-highlight)" />
  
  <!-- Geometric "A" Lettermark with Star-Data Node -->
  <path d="M32 23.5 L19.5 54.5 H26.5 L29.2 47.5 H34.8 L37.5 54.5 H44.5 L32 23.5 Z M32 34 L33.8 41.8 H30.2 L32 34 Z" fill="#F7F5FF" />
  <circle cx="32" cy="23.5" r="2.5" fill="#C18B49" />
  
  <!-- Typography: ANALYTIX -->
  <text x="74" y="44" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="26" letter-spacing="-0.04em" fill="#F7F5FF">ANALYTIX</text>
  <!-- Subtitle: DATA & ANALYTICS CLUB -->
  <text x="75" y="59" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="9" letter-spacing="0.26em" fill="#B9A7E8">DATA &amp; ANALYTICS CLUB</text>
  <circle cx="304" cy="56" r="1.5" fill="#C18B49" />
</svg>