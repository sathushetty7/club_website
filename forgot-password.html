<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Analytix Club</title>
  <link rel="icon" type="image/png" href="assets/analytix-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="header-wrapper">
    <div class="header-container">
      <div class="header-pill">
        <a href="index.html" class="brand-link" aria-label="Analytix Club Home">
          <img src="assets/analytix-logo.png" alt="Analytix Club" class="brand-logo-img">
        </a>
        <div class="header-right">
          <a href="login.html" class="btn-sm-outline">← Back to Sign In</a>
        </div>
      </div>
    </div>
  </header>

  <main class="apple-auth-wrapper">
    <div class="apple-auth-card">
      <div style="display: flex; justify-content: center; margin-bottom: 18px;"><img src="assets/analytix-logo.png" alt="Analytix Club" style="height: 68px; width: auto; object-fit: contain;"></div>
      <h1 class="apple-auth-title">Reset Your Password</h1>
      <p class="apple-auth-subtitle">Enter your registered college or personal email to receive a recovery link</p>

      <div id="forgot-alert" class="alert alert-error" style="display: none;"></div>
      <div id="forgot-success" class="alert alert-success" style="display: none;"></div>

      <form id="forgot-form">
        <div class="apple-input-container">
          <div class="apple-field-row">
            <input type="email" id="email" class="apple-input" placeholder="Registered email address" required autocomplete="email">
            <span class="apple-field-icon">✉️</span>
          </div>
        </div>

        <button type="submit" id="btn-forgot" class="apple-btn-submit" style="margin-top: 16px;">
          <span>Send Recovery Link</span>
          <span>→</span>
        </button>
      </form>

      <div class="apple-footer-link">
        Remember your password? <a href="login.html">Sign In</a>
      </div>
    </div>
  </main>

  <footer class="footer-wrapper">
    <div class="container footer-inner">
      <div style="display: flex; align-items: center; gap: 10px;"><img src="assets/analytix-logo.png" alt="Analytix Club" style="height: 34px; width: auto; object-fit: contain;"><span>&copy; 2026 Analytix Club · Data &amp; Analytics Club · 2026–27</span></div>
      <div class="footer-credits">
        <span>Made by <a href="https://github.com/sathushetty7" target="_blank" rel="noopener noreferrer" class="credit-author">Sathwik Shetty</a></span>
      </div>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('forgot-form');
      const alertBox = document.getElementById('forgot-alert');
      const successBox = document.getElementById('forgot-success');
      const submitBtn = document.getElementById('btn-forgot');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.style.display = 'none';
        successBox.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.querySelector('span:first-child').textContent = 'Sending link...';

        const email = document.getElementById('email').value.trim();
        try {
          await Auth.forgotPassword(email);
          successBox.textContent = 'Password reset link sent! Please check your email inbox.';
          successBox.style.display = 'block';
        } catch (err) {
          alertBox.textContent = err.message || 'Unable to send reset link. Please check your email.';
          alertBox.style.display = 'block';
        } finally {
          submitBtn.disabled = false;
          submitBtn.querySelector('span:first-child').textContent = 'Send Recovery Link';
        }
      });
    });
  </script>
</body>
</html>
