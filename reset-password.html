<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Analytix Club</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo-icon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="header-wrapper">
    <div class="header-container">
      <div class="header-pill">
        <a href="index.html" class="brand-link" aria-label="Analytix Club Home">
          <img src="assets/logo.svg" alt="Analytix Club" class="brand-logo-img">
        </a>
        <div class="header-right">
          <a href="login.html" class="btn-sm-outline">← Back to Sign In</a>
        </div>
      </div>
    </div>
  </header>

  <main class="apple-auth-wrapper">
    <div class="apple-auth-card">
      <div class="apple-logo-badge">🔒</div>
      <h1 class="apple-auth-title">Create New Password</h1>
      <p class="apple-auth-subtitle">Choose a secure password with at least 6 characters</p>

      <div id="reset-alert" class="alert alert-error" style="display: none;"></div>
      <div id="reset-success" class="alert alert-success" style="display: none;"></div>

      <form id="reset-form">
        <div class="apple-input-container">
          <div class="apple-field-row">
            <input type="password" id="new_password" class="apple-input" placeholder="New password" required minlength="6">
          </div>
          <div class="apple-field-row">
            <input type="password" id="confirm_password" class="apple-input" placeholder="Confirm new password" required minlength="6">
          </div>
        </div>

        <button type="submit" id="btn-reset" class="apple-btn-submit" style="margin-top: 16px;">
          <span>Update Password</span>
          <span>→</span>
        </button>
      </form>

      <div class="apple-footer-link">
        <a href="login.html">Return to Sign In</a>
      </div>
    </div>
  </main>

  <footer class="footer-wrapper">
    <div class="container footer-inner">
      <span>&copy; 2026 Analytix Club · Data &amp; Analytics Club · 2026–27</span>
      <div class="footer-nav">
        <a href="index.html">Home</a>
        <a href="login.html">Sign In</a>
      </div>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token') || window.location.hash.replace('#access_token=', '').split('&')[0];

      const form = document.getElementById('reset-form');
      const alertBox = document.getElementById('reset-alert');
      const successBox = document.getElementById('reset-success');
      const submitBtn = document.getElementById('btn-reset');

      if (!token) {
        alertBox.textContent = 'Invalid or missing recovery token. Please request a new link.';
        alertBox.style.display = 'block';
        submitBtn.disabled = true;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.style.display = 'none';

        const p1 = document.getElementById('new_password').value;
        const p2 = document.getElementById('confirm_password').value;

        if (p1 !== p2) {
          alertBox.textContent = 'Passwords do not match.';
          alertBox.style.display = 'block';
          return;
        }

        submitBtn.disabled = true;
        submitBtn.querySelector('span:first-child').textContent = 'Updating...';

        try {
          await Auth.resetPassword(token, p1);
          successBox.textContent = 'Password successfully updated! Redirecting to login...';
          successBox.style.display = 'block';
          setTimeout(() => window.location.href = 'login.html', 1500);
        } catch (err) {
          alertBox.textContent = err.message || 'Failed to reset password.';
          alertBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.querySelector('span:first-child').textContent = 'Update Password';
        }
      });
    });
  </script>
</body>
</html>
